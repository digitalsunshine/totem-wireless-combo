CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

# Pointing Device (Mouse) Settings
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# Increase scroll speed/resolution step sizes
CONFIG_ZMK_POINTING_DEFAULT_SCRL_PULSES=10

# Set transmit power to +4 dBm (nRF52840 hardware max)
# Remove PLUS_8 to prevent redundant power draw
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Keeps low latency and strong BLE link stability
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# ==================================================================
#                     BATTERY SAVING OPTIMIZATIONS
# ==================================================================

# Enable Deep Sleep mode (Cuts idle power draw down to microamps)
CONFIG_ZMK_SLEEP=y

# Milliseconds of inactivity before entering deep sleep (15 minutes)
# Pressing any key wakes the keyboard instantly (~1 second)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# Battery Reporting Optimization
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
