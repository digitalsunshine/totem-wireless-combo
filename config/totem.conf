CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_POINTING=y

# Maximize Bluetooth transmit power to +4 dBm (nRF52840 / XIAO BLE max)
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y

# Enable experimental connection parameter updates to lower BLE latency
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
